# ─────────────────────────────────────────────────────────────
#  NJFU智慧猫娘 · 配置文件
#  第一次运行 npm run setup 会把本模板复制成 config.toml，请修改 config.toml。
#  TOML 格式：# 后面是注释；文字要加英文双引号；true / false 表示开 / 关。
#  没写的项目会自动使用本模板里的默认值。
# ─────────────────────────────────────────────────────────────

[server]
# 要连接的服务器。局域网世界填 127.0.0.1 和“对局域网开放”时显示的端口。
host = "127.0.0.1"
port = 25565
# 服务器版本："auto" 自动检测（推荐）。
version = "auto"

[account]
# 登录名：3～16 个字符，只能用英文字母、数字、下划线（服务器不认中文名）。
# 中文名「NJFU智慧猫娘」通过下面的 [identity] 显示在聊天栏和头顶。
username = "NJFU_Neko"
# "offline"：离线/局域网（不需要账号）
# "microsoft"：正版账号。不用写密码：第一次启动时控制台会给出微软登录码，
#              在浏览器里登录一次即可，登录凭据缓存在 runtime/auth 里。
auth = "offline"

[identity]
display_name = "NJFU智慧猫娘"
# 名字颜色：light_purple、aqua、gold、green、yellow、red 等
name_color = "light_purple"
team_name = "njfu_neko"
# 有管理员权限时，自动创建队伍，让头顶和列表里显示 [NJFU智慧猫娘] 前缀
setup_team = true
# 有管理员权限时，用 /tellraw 以「<NJFU智慧猫娘> …」的样子说话（没有权限就普通聊天）
speak_with_tellraw = true
# 进入世界时的招呼语，留空 "" 表示不打招呼
greeting = "NJFU智慧猫娘上线啦喵～ 喊一声「猫娘」就能叫我，发 #帮助 看看我会做什么哦"
# 没有管理员权限时，是否在聊天栏提醒一次
ask_for_op = true

[viaproxy]
# 协议转换代理：mineflayer 暂不支持的新版本服务器（如 26.2）需要经它转换。
# "auto"：版本不支持时自动启用（推荐）；"always"：总是启用；"never"：从不启用
mode = "auto"
# Java 可执行文件（需要 Java 17+）。不在 PATH 里就写完整路径，例如 "D:/Code/Java/bin/java.exe"
java = "java"
jar = "runtime/viaproxy/ViaProxy.jar"
# 代理在本机监听的端口（被占用时自动顺延）
bind_port = 25568
# 机器人以哪个版本连接代理（mineflayer 支持的最高版本）
client_version = "26.1"
# 目标服务器是正版验证（online-mode）且需要代理时，改成 "ACCOUNT"，
# 并先运行一次 ViaProxy 图形界面（java -jar ViaProxy.jar）在 Accounts 里登录账号。
auth_method = "NONE"

[chat]
# 聊天里包含这些词（不分大小写）就算在叫猫娘
triggers = ["猫娘", "NJFU", "neko"]
# true：回应所有人的每一句话（热闹的服务器上别开）
respond_to_all = false
# 服务器里只有你和猫娘两个人时，你说的每句话都算对猫娘说
respond_when_alone = true
# 猫娘回复某人后的这么多秒内，这个人的下一句话也算对猫娘说（0 关闭）
follow_up_seconds = 60
# 主人名单（游戏里的名字）。只有主人能让猫娘执行 / 命令、攻击玩家、用 #过来 等命令。
# 留空 [] 表示所有人都是主人——只适合自己的单机/局域网世界！上服务器前一定要填。
# 注意：离线模式（关闭正版验证）下名字可以被冒用，对外开放时请设访问密码或白名单。
owners = []
# 快捷命令前缀：#状态 #背包 #帮助 …
command_prefix = "#"
# 每行最多多少字，太长会自动分行
max_line_length = 90

[behavior]
# 饿了自动吃东西
auto_eat = true
# 自动穿上更好的盔甲
auto_armor = true
# 死亡后自动重生
auto_respawn = true
# 被怪物攻击会还手（苦力怕会躲开）
self_defense = true
# 主人在打怪时过去帮忙
assist_owner = true
# 主人被怪物攻击时去保护
protect_owner = true
# 血量到这个值时撤退（0 表示不撤退）。默认 1 滴血；普通模式会多 2（3 滴血）
retreat_health = 1
# 不攻击挂了命名牌的生物（防止误伤刷怪塔、农场等机器里的生物）
never_attack_named = true
# 禁战区：这些长方体区域里的生物不打，每项写 [x1, y1, z1, x2, y2, z2]
no_attack_zones = []
# 没事做时陪在主人身边、四处走动
companion = true
# 离主人超过这么多格（或看不见主人）时自动传送过去，需要管理员权限（0 关闭）
teleport_distance = 48
# 自动捡起身边的掉落物
pickup_items = true
# 缺盔甲、武器、食物时，到记得的箱子里拿
use_chests = true
# 闲着时顺手翻看附近 48 格内没看过的箱子（只看不拿，每 3 分钟一轮、一轮最多 8 个），记下里面有什么；饿了没吃的时也会先去翻
survey_chests = true
# 有人天黑上床时，问要不要一起睡
ask_to_sleep = true
# 断线后自动重连
reconnect = true
reconnect_delay_seconds = 15
# 走路时是否允许挖开挡路的方块（false 更安全，不会误拆你的房子）
dig_while_pathing = false
# 扔垃圾：背包快满（空位 4 格以内）而且闲着时，把没用的东西扔掉：腐肉、毒马铃薯、多余的杂石和种子、
# 比身上差的盔甲和工具（不扔别人送的礼物、附魔或改过名的东西；圆石、泥土各留 64 个垫脚用）
toss_junk = true
# 垫方块脱困：平时走路不放方块；只有被困住、找不到路时，才用身上的泥土、圆石这类便宜方块搭桥、垫高走出来。
# （建造和战斗时照常放方块；临时放的工作台、熔炉用完会收回来）
scaffold = true
# 防摔：从高处掉下来时落地前倒水（下界不行）、用鞘翅滑翔或者放船坐进去，不摔伤
fall_safety = true

[emotes]
# 头顶冒爱心、猫叫声等特效（需要管理员权限）
effects = true
# 摸头、捡木棍等互动
interactions = true
# 上线下线问候、死亡关心、进度祝贺、早晚提醒
greetings = true
# 玩家死亡时去死亡地点帮忙看着掉落物
guard_death_drops = true
# 闲着时偶尔做点小动作
idle_emotes = true

[ui]
# 查看猫娘的背包：
#   · 装了面板模组（mod/dist/njfu-neko-panel-*.jar，放进游戏的 mods 文件夹）：右键她打开人物面板，能直接拿放东西；
#     Shift+右键打开功能菜单；她执行命令时也不会在管理员聊天栏里留下灰色提示。
#   · 没装：发 #背包 / #菜单 弹出窗口查看（需要她有管理员权限；每次弹窗原版会给管理员们留一行灰色提示）。
# #背包 弹出可视化窗口（服务器 1.21.6+ 且猫娘有管理员权限时可用）
inventory_dialog = true
# 游戏客户端 jar 的路径，用来读取物品贴图清单，让背包里显示物品图标。
# 留空时会根据 mods.litematica_schematics 自动推断；例如 "D:/Game/.minecraft/versions/26.2/26.2.jar"
client_jar = ""

[combat]
# 战斗模式（游戏里发 #战斗模式 也能切换）：
#   "普通"  会用盾牌、弓箭、药水和金苹果救急；剩 3 滴血就撤
#   "困难"  再加上岩浆桶先烫再打、跳劈、横扫、边打边退、船困怪、水桶冲开怪群、垫高躲怪、按引信打苦力怕；剩 1 滴血才撤
#   "极限"  所有技巧都用：再加鞘翅撤离、附魔金苹果；剩 1 滴血才撤
#   "作弊"  极限 + 临时发一套顶级附魔装备（需要管理员权限），切回别的模式时收回
mode = "困难"
# 日常索敌范围（格）：多远的敌对生物会主动去打（和战斗模式无关）。墙后、地底下看不见的只处理 6 格内的；
# 走不过去的追一阵没进展就先不管。末影龙、凋灵这种在天上绕大圈的 Boss 和恶魂（有弓才打）不受这个限制。
engage_radius = 32
# 作弊模式发哪套装备："下界合金" 或 "钻石"；再发几个附魔金苹果、几个不死图腾、要不要药水和鞘翅
cheat_tier = "下界合金"
cheat_gapples = 4
cheat_totems = 2
cheat_potions = true
cheat_elytra = false
# 下面这些是“允许用”的开关（模式决定用不用，两个都是才用）
# 跳劈：起跳后在下落时出手，打出暴击（伤害 ×1.5），也不会横扫误伤旁边的人
crits = true
# 用盾牌：箭和火球飞来、骷髅拉弓、苦力怕要炸时举盾，出手前放下（被斧头打掉后自动等冷却）
shield = true
# 打不过的近战怪（卫道士、凋灵骷髅、末影人等，或自己血少时）在中间放一条船把它困住再打；打完把船收回来
boat_trap = true
# 用弓箭（射苦力怕、恶魂、烈焰人、末影水晶等）
bow = true
# 拿着近战武器且血量健康时，苦力怕“打了就跑”：在它还不会膨胀的距离冲刺击退再退开
creeper_melee = true
# 血量低时吃金苹果（附魔金苹果只在打 Boss 时用）
golden_apples = true
# 用药水：血少时喝治疗/再生药水（或对自己扔喷溅药水），着火时喝抗火药水
potions = true
# 被围住又打不过时，原地垫方块搭柱子躲上去，在上面打或射箭
pillar = true
# 血少时把不死图腾换到副手
totem = true
# 群怪时用剑平砍横扫（旁边有玩家、村民、宠物时不横扫）；边打边往后退，别被围住
sweep = true
kite = true
# 用水桶在自己和怪群之间倒水把怪冲开（打完收回）
water = true
# 岩浆桶烫怪（困难以上）：能烫先烫——开打前把够得着的怪都点一下（放下马上用空桶收回），群怪就一只只烫过去，再砍。
# 紧挨着有木头、羊毛等会烧的东西或水、主人在旁边时不倒；不怕火的、末影人（会瞬移）、女巫（会喝抗火）不烫；下雨天照样烫
lava = true
# 被怪群围住、血很少时用鞘翅飞走（只在极限/作弊模式用，要有烟花）
elytra = true
# 被怪群围住时扔末影珍珠逃走（困难以上；会掉 2.5 颗心，血太少不用）
pearls = true
# 附魔金苹果（普通/困难模式只在打 Boss 时吃）
enchanted_apples = true

[affection]
# 好感度系统
enabled = true
# 新认识的玩家的初始好感，主人的初始好感
start = 20
owner_start = 50
# 每天通过聊天和大脑判断最多能加多少好感、通过送礼最多加多少
daily_chat_cap = 10
daily_gift_cap = 30

[duel]
# PVP 决斗
enabled = true
# 难度：简单、普通、困难Ⅰ～Ⅵ、作弊Ⅰ～Ⅵ（游戏里发 #决斗 选），装备一级比一级强，都是临时的，打完收回；
# 默认给对手也穿一套一样的（20 秒内回“不用”就不穿）。所有难度都强制锁 1 滴血，谁都不会被打死。
# 装了面板模组 1.0.4 以上：模组锁血（有不死图腾时让图腾触发）、附近的爆炸不破坏方块、替双方保管背包再换装备；
# 没装时她收尾改用空手打保证不打死对方，装备发进背包，不用岩浆、爆炸。
# 决斗场：原地上空（默认，在决斗的地方正上方）、家上空（传送到家正上方）、不用（就地打）。
# 开打前在 y=200 起现搭 100×100 的黑曜石平台，四面屏障墙到 y=319、不封顶；搭之前把那一片从地板到 y=319 都扫一遍，
# 有任何方块就往上抬 30 格再看，还不行就不搭，绝不盖住别的东西。打完清场、拆掉（不留着，免得挡住下面的阳光），送回原处。
arena = "原地上空"
# 一局最长多少分钟（屏幕上方有倒计时，最后 1 分钟提醒；随时可以 #认输）；作弊档单独算
time_limit_minutes = 15
cheat_time_limit_minutes = 30
# 结束后给双方回满血（需要管理员权限）
heal_after = true

[mods]
# 投影（Litematica）原理图文件夹，例如 "D:/Game/Minecraft/.minecraft/schematics"
# （开了版本隔离的话在 versions/版本名/schematics）。留空表示不用。
litematica_schematics = ""
# 一次最多建造多少个方块的原理图
max_schematic_blocks = 20000
# Chunkbase 地图链接的版本参数，留空按服务器版本自动生成（如 java_26_2）
chunkbase_platform = ""

[brain]
# 谁来当猫娘的“大脑”：
#   "api"         独立运行，直接调用 Claude API（需要下面 [brain.api] 的认证，按用量计费）
#   "openai"      独立运行，调用 OpenAI 兼容接口：GPT、DeepSeek，或者通义千问、Kimi、本地 Ollama 等（见 [brain.openai]）
#   "claude-code" 用 Claude Code 思考（Claude 官网订阅账号就行，不用 API Key）：开着 Claude Code 会话时由它接管，
#                 没开时猫娘自己调用命令行版 Claude Code 回话（见 [brain.claude_code]）
#   "none"        只挂机，不思考不回话（快捷命令、自动行为照常工作）
mode = "api"

[brain.api]
# 认证方式（按顺序，找到一个就用）：
#   1. 在这里填控制台的 API Key（sk-ant- 开头）
#   2. 留空，读取环境变量 ANTHROPIC_API_KEY（更安全，分享配置文件也不会泄露）
#   3. 留空，用官方命令行 ant auth login 在浏览器登录 Claude 平台账号（不需要 Key）
api_key = ""
# API 地址，留空用官方地址；使用代理/中转服务时填写（你的 Key 会发给这个地址，请确认可信）
base_url = ""
model = "claude-opus-5-5"
# 思考力度："low" 反应最快最省钱 / "medium" 均衡（推荐）/ "high" 更聪明但更慢更贵
effort = "medium"
max_tokens = 16000
# 一次对话里最多连续调用多少轮工具
max_tool_rounds = 12
# 被安全策略拒绝时，自动换 Anthropic 推荐的备用模型重试（按备用模型的价格计费）
# 用的代理不支持这个功能而报错时，改成 false
fallbacks = true
# 让工具参数严格符合格式（代理不支持时会自动关闭）
strict_tools = true
# 允许大脑上网查资料（只能访问下面的网站）；会产生额外的搜索费用
web_search = true
web_domains = ["zh.minecraft.wiki", "minecraft.wiki", "www.mcmod.cn", "mcmod.cn"]
# 给大脑看最近多少条聊天
recent_chat_lines = 20
# 每小时最多思考多少次（防止刷屏和意外花费）
max_episodes_per_hour = 120
# 后台任务完成后，最多连续自动续做几步（有人说话会重新计数）
max_auto_steps = 8

[brain.openai]
# mode = "openai" 时用。服务商：
#   "openai"    GPT（默认模型 gpt-5，Key 放环境变量 OPENAI_API_KEY）
#   "deepseek"  DeepSeek（默认模型 deepseek-chat，Key 放环境变量 DEEPSEEK_API_KEY）
#   "custom"    其他兼容 Chat Completions 和函数调用（tools）的服务：通义千问、Kimi、智谱、本地 Ollama / LM Studio……
#               要自己填 base_url 和 model（本机地址可以不要 Key）
provider = "openai"
# 模型名，留空用服务商的默认。模型必须支持函数调用（tools），DeepSeek 用 deepseek-chat
model = ""
# 接口地址，留空用服务商的默认（openai：https://api.openai.com/v1，deepseek：https://api.deepseek.com）
# 例：通义千问 "https://dashscope.aliyuncs.com/compatible-mode/v1"，Kimi "https://api.moonshot.cn/v1"，Ollama "http://localhost:11434/v1"
base_url = ""
# 认证：留空时读环境变量（更安全，分享配置文件也不会泄露）；也可以直接填 Key
api_key = ""
# 放 Key 的环境变量名，留空按服务商：openai / custom 用 OPENAI_API_KEY，deepseek 用 DEEPSEEK_API_KEY
api_key_env = ""
# 思考力度（只有 OpenAI 的推理模型认，比如 gpt-5）："minimal"/"low" 反应快、"medium"/"high" 更聪明更慢；留空不设置
effort = "low"
max_tokens = 8000
# 一次请求最多等多少秒
timeout_seconds = 120
# 一次对话里最多连续调用多少轮工具
max_tool_rounds = 12
# 给大脑看最近多少条聊天
recent_chat_lines = 20
# 每小时最多思考多少次（防止刷屏和意外花费）
max_episodes_per_hour = 120
# 后台任务完成后，最多连续自动续做几步（有人说话会重新计数）
max_auto_steps = 8

[brain.claude_code]
# mode = "claude-code" 时用。开着 Claude Code 会话（它用 watch 在监听）时由它接管猫娘；
# 没开时（直接 npm start / start.bat），猫娘自己调用本机的命令行版 Claude Code（claude -p）想一轮，用你登录的 Claude 账号。
# 那一轮的 Claude 只有猫娘的动作工具（说话、走路、采集……），碰不到电脑上的文件和命令；不是主人的玩家也用不了只替主人做的事。
# 第一次用要在终端登录一次：claude auth login（启动时控制台会提示完整命令）
# 没开会话时也自己回话；false = 只等 Claude Code 会话（没开时在游戏里提示一句）
headless = true
# 命令行 claude 的位置，留空自动找（PATH、~/.local/bin、Claude 桌面版自带的、npm 全局安装的）
cli = ""
# 模型："sonnet" 反应快、省订阅额度（推荐）/ "opus" 更聪明但更慢 / 留空用命令行默认的
model = "sonnet"
# 思考力度："low" 反应最快（推荐，聊天够用）/ "medium" / "high"；留空用默认
effort = "low"
# 一轮最多调用多少次工具
max_turns = 12
# 一轮最多想多少秒
timeout_seconds = 180
# 给大脑看最近多少条聊天
recent_chat_lines = 20
# 每小时最多自己想多少次（防止刷屏、用光订阅额度）
max_episodes_per_hour = 60
# 后台任务完成后，最多连续自动续做几步（有人说话会重新计数）
max_auto_steps = 6

[commands]
# 是否允许执行 / 命令
allow = true
# 任何玩家请求都可以用的命令（查询类、不影响别人的）。其余命令只替主人执行。
anyone = ["locate", "seed", "list", "help", "info", "distance", "counter", "log", "tellraw", "msg", "tell", "w", "me", "teammsg", "tm", "trigger"]
# 这些命令影响大，执行前要先和主人确认
confirm = ["fill", "clone", "kill", "gamerule", "difficulty", "clear", "summon", "setworldspawn", "worldborder", "forceload", "gamemode", "script", "carpet", "fillbiome", "place", "reload", "datapack", "function", "spreadplayers"]
# 永远不执行的命令
deny = ["stop", "op", "deop", "ban", "ban-ip", "pardon", "pardon-ip", "kick", "whitelist", "save-off", "publish", "unpublish", "transfer", "jfr", "perf", "debug"]

[control]
# 本机控制接口（命令行 neko、Claude Code 模式都靠它），只接受本机带令牌的请求
enabled = true
host = "127.0.0.1"
port = 3777
# 允许在机器人进程里执行任意 JS（调试用）。平时保持关闭更安全。
allow_eval = false

[logging]
# 控制台显示的日志级别：debug / info / warn / error
console_level = "info"
# 日志文件（runtime/logs/neko-日期.log）记录的级别，debug 最详细，排查问题时有用
file_level = "debug"
# 日志文件保留天数
keep_days = 14
# 把每次 Claude API 请求和回复的完整内容也写进日志（很长，排查大脑问题时再开）
log_api_payloads = false

[compat]
# 模拟 Fabric 客户端握手（连装了 Fabric API 的服务器/局域网世界时必需；普通服务器无影响）
fabric_handshake = true
